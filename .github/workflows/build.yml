name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all
      version:
        description: 'DSH版本号（留空则自动解析最新版）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 统一解析 DSH 版本号：双架构必须用同一版本，避免 arm/x86 构建出的
  # 两个 FPK 里 DSH 版本不一致（各自解析 latest 时上游可能刚好发新版）
  resolve:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: 解析 DSH 版本
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(npm view @deepseek-ai/dsh dist-tags.next 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null || true)
            if [ -z "$VER" ]; then
              echo "ERROR: 无法从 npm 解析版本号，请在触发时手动填写 version" >&2
              exit 1
            fi
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "本次构建使用 DSH 版本: $VER"

  build-arm:
    name: 构建 ARM64
    needs: resolve
    if: inputs.platform == 'arm' || inputs.platform == 'all'
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # build.sh: 下载Node → npm install DSH → patch.py补丁 → 输出 app_arm64.tgz
      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: arm64
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash build.sh

      # 从 build.sh 产出的 app.tgz 中提取实际 DSH 版本号
      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_arm64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          # 兜底：包内读取失败时使用 resolve job 统一解析的版本，不再二次查询 npm
          if [ -z "$DSH_VER" ]; then
            DSH_VER="${{ needs.resolve.outputs.version }}"
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      # 更新 manifest 中的 version 和 platform
      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = arm/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      # FPK = tar.gz，所有文件在根目录
      - name: 打包 FPK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FPK_NAME="deepseek-harness_${VERSION}_arm.fpk"
          PKG="deepseek-harness"

          # 复制 app.tgz 到 deepseek-harness/
          cp app_arm64.tgz "$PKG/app.tgz"

          # 复制 ui 到根目录供 FPK 使用
          cp -a "$PKG/app/ui" "$PKG/ui"

          # 打包 FPK（所有文件在根目录，与参考项目一致）
          cd "$PKG"
          tar -cf "../deepseek-harness.tar" \
            manifest \
            ICON.PNG \
            ICON_256.PNG \
            app.tgz \
            cmd/ \
            config/ \
            wizard/ \
            ui/ \
            DeepSeekHarness.sc
          cd ..
          gzip -1 deepseek-harness.tar
          mv deepseek-harness.tar.gz "${FPK_NAME}"

          echo "✅ 构建完成: $(ls -lh ${FPK_NAME})"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-arm
          path: "*.fpk"
          if-no-files-found: error

  build-x86:
    name: 构建 x86_64
    needs: resolve
    if: inputs.platform == 'x86' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: amd64
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash build.sh

      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          # 兜底：包内读取失败时使用 resolve job 统一解析的版本，不再二次查询 npm
          if [ -z "$DSH_VER" ]; then
            DSH_VER="${{ needs.resolve.outputs.version }}"
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = x86/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 打包 FPK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FPK_NAME="deepseek-harness_${VERSION}_x86.fpk"
          PKG="deepseek-harness"

          cp app_amd64.tgz "$PKG/app.tgz"
          cp -a "$PKG/app/ui" "$PKG/ui"

          cd "$PKG"
          tar -cf "../deepseek-harness.tar" \
            manifest \
            ICON.PNG \
            ICON_256.PNG \
            app.tgz \
            cmd/ \
            config/ \
            wizard/ \
            ui/ \
            DeepSeekHarness.sc
          cd ..
          gzip -1 deepseek-harness.tar
          mv deepseek-harness.tar.gz "${FPK_NAME}"

          echo "✅ 构建完成: $(ls -lh ${FPK_NAME})"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: "*.fpk"
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [build-arm, build-x86]
    if: always() && (needs.build-arm.result == 'success' || needs.build-x86.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 获取版本号与构建产物
        id: version
        run: |
          # 优先使用构建job传递的版本号
          VER="${{ needs.build-arm.outputs.version || needs.build-x86.outputs.version }}"
          if [ -z "$VER" ]; then
            echo "ERROR: 无法获取版本号" >&2
            exit 1
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本: $VER"

          mkdir -p release
          find artifacts -name "*.fpk" -exec cp {} release/ \;

          # 动态检测已构建的架构
          HAS_ARM="false"
          HAS_X86="false"
          if ls release/*_arm.fpk 1>/dev/null 2>&1; then HAS_ARM="true"; fi
          if ls release/*_x86.fpk 1>/dev/null 2>&1; then HAS_X86="true"; fi
          echo "has_arm=$HAS_ARM" >> $GITHUB_OUTPUT
          echo "has_x86=$HAS_X86" >> $GITHUB_OUTPUT

          ls -lh release/

      - name: 生成 Release 说明
        id: body
        run: |
          VER="${{ steps.version.outputs.version }}"
          HAS_ARM="${{ steps.version.outputs.has_arm }}"
          HAS_X86="${{ steps.version.outputs.has_x86 }}"

          BODY="## DeepSeek Harness v${VER}\n\n### 📦 下载\n\n| 文件 | 架构 | 适用设备 |\n|------|------|----------|\n"

          if [ "$HAS_X86" = "true" ]; then
            BODY="${BODY}| \`deepseek-harness_${VER}_x86.fpk\` | x86_64 | Intel/AMD NAS |\n"
          fi
          if [ "$HAS_ARM" = "true" ]; then
            BODY="${BODY}| \`deepseek-harness_${VER}_arm.fpk\` | arm64 | ARM NAS |\n"
          fi

          BODY="${BODY}\n### 安装方式\n1. 下载对应架构的 \`.fpk\` 文件\n2. 登录飞牛NAS桌面 → 应用中心 → 手动安装\n3. 选择下载的文件完成安装"

          # 写入多行文件避免 shell 转义问题
          echo -e "$BODY" > release_body.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.version }}"
          files: release/*.fpk
          generate_release_notes: false
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
