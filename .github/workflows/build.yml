name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build-arm:
    name: Build ARM64 FPK
    if: inputs.platform == 'arm' || inputs.platform == 'all'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package (ARM64)
        env:
          TARBALL_ARCH: arm64
        run: bash scripts/build.sh

      - name: Build FPK (ARM)
        run: bash build-fpk.sh "" arm

      - name: Upload ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-arm64
          path: "*_arm.fpk"
          if-no-files-found: error

  build-x86:
    name: Build x86_64 FPK
    if: inputs.platform == 'x86' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package (x86_64)
        env:
          TARBALL_ARCH: amd64
        run: bash scripts/build.sh

      - name: Build FPK (x86)
        run: bash build-fpk.sh "" x86

      - name: Upload x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: "*_x86.fpk"
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-arm, build-x86]
    if: always() && (needs.build-arm.result == 'success' || needs.build-x86.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get DSH Version
        id: version
        run: |
          # 从app.tgz中提取DSH版本
          if [ -f artifacts/fpk-arm64/app_amd64.tgz ]; then
            DSH_VER=$(tar -xzf artifacts/fpk-arm64/app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          elif [ -f artifacts/fpk-x86/app_amd64.tgz ]; then
            DSH_VER=$(tar -xzf artifacts/fpk-x86/app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          
          # 从npm查询
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh dist-tags.next 2>/dev/null || npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          
          echo "dsh_version=${DSH_VER}" >> $GITHUB_OUTPUT
          echo "DSH版本: ${DSH_VER}"
          
          # 收集FPK文件
          mkdir -p release
          find artifacts -name "*.fpk" -exec cp {} release/ \;
          echo "Release文件:"
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.dsh_version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.dsh_version }}"
          files: release/*.fpk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.dsh_version }}
            
            基于 DeepSeek Harness (DSH) ${{ steps.version.outputs.dsh_version }} 构建
            
            ### 下载安装包
            - **x86_64**: `deepseek-harness_${{ steps.version.outputs.dsh_version }}_x86.fpk`
            - **ARM64**: `deepseek-harness_${{ steps.version.outputs.dsh_version }}_arm.fpk`
            
            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
