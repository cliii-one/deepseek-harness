name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build-arm:
    name: 构建 ARM64
    if: inputs.platform == 'arm' || inputs.platform == 'all'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: arm64
        run: bash build.sh

      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_arm64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = arm/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 打包 app.tgz
        run: |
          python3 -c "
          import tarfile, os
          with tarfile.open('app.tgz', 'w:gz') as tar:
              for root, dirs, files in os.walk('deepseek-harness/app'):
                  for f in files:
                      full = os.path.join(root, f)
                      tar.add(full, arcname=os.path.relpath(full, 'deepseek-harness/app'))
          "
          mv app.tgz deepseek-harness/

      - name: 下载 fnpack 并打包
        working-directory: deepseek-harness
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-arm64
          chmod +x /tmp/fnpack
          /tmp/fnpack build --directory .
          VERSION="${{ steps.version.outputs.version }}"
          FPKN=$(ls *.fpk)
          mv "$FPKN" "deepseek-harness_${VERSION}_arm.fpk"
          echo "✅ 构建完成: $(ls -lh *.fpk)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-arm
          path: deepseek-harness/*.fpk
          if-no-files-found: error

  build-x86:
    name: 构建 x86_64
    if: inputs.platform == 'x86' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: amd64
        run: bash build.sh

      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = x86/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 打包 app.tgz
        run: |
          python3 -c "
          import tarfile, os
          with tarfile.open('app.tgz', 'w:gz') as tar:
              for root, dirs, files in os.walk('deepseek-harness/app'):
                  for f in files:
                      full = os.path.join(root, f)
                      tar.add(full, arcname=os.path.relpath(full, 'deepseek-harness/app'))
          "
          mv app.tgz deepseek-harness/

      - name: 下载 fnpack 并打包
        working-directory: deepseek-harness
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          chmod +x /tmp/fnpack
          /tmp/fnpack build --directory .
          VERSION="${{ steps.version.outputs.version }}"
          FPKN=$(ls *.fpk)
          mv "$FPKN" "deepseek-harness_${VERSION}_x86.fpk"
          echo "✅ 构建完成: $(ls -lh *.fpk)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: deepseek-harness/*.fpk
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [build-arm, build-x86]
    if: always() && (needs.build-arm.result == 'success' || needs.build-x86.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 获取版本号
        id: version
        run: |
          MANIFEST_VER=$(grep '^version' deepseek-harness/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$MANIFEST_VER" >> $GITHUB_OUTPUT
          mkdir -p release
          find artifacts -name "*.fpk" -exec cp {} release/ \;
          ls -lh release/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.version }}"
          files: release/*.fpk
          generate_release_notes: false
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.version }}

            ### 📦 下载

            | 文件 | 架构 | 适用设备 |
            |------|------|----------|
            | `deepseek-harness_${{ steps.version.outputs.version }}_x86.fpk` | x86_64 | Intel/AMD NAS |
            | `deepseek-harness_${{ steps.version.outputs.version }}_arm.fpk` | arm64 | ARM NAS |

            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
