name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build-arm:
    name: 构建 ARM64
    if: inputs.platform == 'arm' || inputs.platform == 'all'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # build.sh: 下载Node → npm install DSH → patch.py补丁 → 输出 app_arm64.tgz
      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: arm64
        run: bash build.sh

      # 从 build.sh 产出的 app.tgz 中提取实际 DSH 版本号
      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_arm64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      # 更新 manifest 中的 version 和 platform
      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = arm/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      # FPK = tar.gz，所有文件在根目录
      - name: 打包 FPK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FPK_NAME="deepseek-harness_${VERSION}_arm.fpk"
          PKG="deepseek-harness"

          # 复制 app.tgz 到 deepseek-harness/
          cp app_arm64.tgz "$PKG/app.tgz"

          # 复制 ui 到根目录供 FPK 使用
          cp -a "$PKG/app/ui" "$PKG/ui"

          # 打包 FPK（所有文件在根目录，与参考项目一致）
          cd "$PKG"
          tar -cf "../deepseek-harness.tar" \
            manifest \
            ICON.PNG \
            ICON_256.PNG \
            app.tgz \
            cmd/ \
            config/ \
            wizard/ \
            ui/ \
            DeepSeekHarness.sc
          cd ..
          gzip -1 deepseek-harness.tar
          mv deepseek-harness.tar.gz "${FPK_NAME}"

          echo "✅ 构建完成: $(ls -lh ${FPK_NAME})"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-arm
          path: "*.fpk"
          if-no-files-found: error

  build-x86:
    name: 构建 x86_64
    if: inputs.platform == 'x86' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: amd64
        run: bash build.sh

      - name: 获取 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      - name: 更新 manifest
        working-directory: deepseek-harness
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = x86/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        working-directory: deepseek-harness
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 打包 FPK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FPK_NAME="deepseek-harness_${VERSION}_x86.fpk"
          PKG="deepseek-harness"

          cp app_amd64.tgz "$PKG/app.tgz"
          cp -a "$PKG/app/ui" "$PKG/ui"

          cd "$PKG"
          tar -cf "../deepseek-harness.tar" \
            manifest \
            ICON.PNG \
            ICON_256.PNG \
            app.tgz \
            cmd/ \
            config/ \
            wizard/ \
            ui/ \
            DeepSeekHarness.sc
          cd ..
          gzip -1 deepseek-harness.tar
          mv deepseek-harness.tar.gz "${FPK_NAME}"

          echo "✅ 构建完成: $(ls -lh ${FPK_NAME})"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: "*.fpk"
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [build-arm, build-x86]
    if: always() && (needs.build-arm.result == 'success' || needs.build-x86.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 获取版本号
        id: version
        run: |
          # 从FPK文件名中提取版本号（DSH版本是唯一来源）
          # 文件名格式: deepseek-harness_0.1.1-rc.2_arm.fpk
          FPK_FILE=$(find artifacts -name "*.fpk" | head -1)
          VER=$(echo "$FPK_FILE" | sed 's/.*deepseek-harness_//' | sed 's/_[^_]*\.fpk$//')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本: $VER"
          mkdir -p release
          find artifacts -name "*.fpk" -exec cp {} release/ \;
          ls -lh release/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.version }}"
          files: release/*.fpk
          generate_release_notes: false
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.version }}

            ### 📦 下载

            | 文件 | 架构 | 适用设备 |
            |------|------|----------|
            | `deepseek-harness_${{ steps.version.outputs.version }}_x86.fpk` | x86_64 | Intel/AMD NAS |
            | `deepseek-harness_${{ steps.version.outputs.version }}_arm.fpk` | arm64 | ARM NAS |

            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
