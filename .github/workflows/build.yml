name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build:
    name: Build FPK Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package
        env:
          TARBALL_ARCH: amd64
        run: bash scripts/build.sh

      - name: Build FPK (x86)
        if: inputs.platform == 'all' || inputs.platform == 'x86'
        run: bash build-fpk.sh "" x86

      - name: Build FPK (ARM)
        if: inputs.platform == 'all' || inputs.platform == 'arm'
        run: bash build-fpk.sh "" arm

      - name: Get DSH Version
        id: version
        run: |
          # 从构建产物中获取实际使用的DSH版本
          if [ -f app_amd64.tgz ]; then
            DSH_VER=$(tar -xzf app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          
          # 如果无法从包中获取，尝试从npm查询
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh dist-tags.next 2>/dev/null || npm view @deepseek-ai/dsh@latest version 2>/dev/null || echo "")
          fi
          
          echo "dsh_version=${DSH_VER}" >> $GITHUB_OUTPUT
          echo "DSH版本: ${DSH_VER}"
          
          # 列出构建产物
          echo "构建产物:"
          ls -lh *.fpk 2>/dev/null || echo "无FPK产物"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-${{ steps.version.outputs.dsh_version }}
          path: "*.fpk"
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.dsh_version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.dsh_version }}"
          files: "*.fpk"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.dsh_version }}
            
            基于 DeepSeek Harness (DSH) ${{ steps.version.outputs.dsh_version }} 构建
            
            ### 下载安装包
            - **x86_64**: `deepseek-harness_${{ steps.version.outputs.dsh_version }}_x86.fpk`
            - **ARM64**: `deepseek-harness_${{ steps.version.outputs.dsh_version }}_arm.fpk`
            
            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
