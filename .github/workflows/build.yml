name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: 构建 ${{ matrix.arch }}
    strategy:
      matrix:
        include: ${{ fromJSON(
          inputs.platform == 'all' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm","fnpack_platform":"arm"},{"arch":"x86_64","runner":"ubuntu-latest","fnpack_platform":"x86"}]' ||
          inputs.platform == 'arm' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm","fnpack_platform":"arm"}]' ||
          '[{"arch":"x86_64","runner":"ubuntu-latest","fnpack_platform":"x86"}]'
        ) }}

    defaults:
      run:
        working-directory: deepseek-harness

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 App 包
        working-directory: scripts
        env:
          TARBALL_ARCH: ${{ matrix.arch }}
        run: bash build.sh

      - name: 确定 DSH 版本号
        id: version
        run: |
          DSH_VER=$(tar -xzf ../app_${{ matrix.arch }}.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=$DSH_VER" >> $GITHUB_OUTPUT
          echo "DSH版本: $DSH_VER"

      - name: 更新 manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.fnpack_platform }}"
          sed -i "s/^version.*/version               = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform              = ${PLATFORM}/" manifest
          echo "=== manifest ===" && cat manifest

      - name: 修复脚本权限
        run: |
          for f in cmd/* wizard/*; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 打包 FPK
        run: |
          # 下载 fnpack
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-arm64
          else
            curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          fi
          chmod +x /tmp/fnpack

          # 打包 app.tgz
          cd ..
          python3 -c "
          import tarfile, os
          with tarfile.open('app.tgz', 'w:gz') as tar:
              for root, dirs, files in os.walk('deepseek-harness/app'):
                  for f in files:
                      full = os.path.join(root, f)
                      tar.add(full, arcname=os.path.relpath(full, 'deepseek-harness/app'))
          "
          mv app.tgz deepseek-harness/

          # 使用 fnpack 打包 FPK
          cd deepseek-harness
          /tmp/fnpack build --directory .
          FPKN=$(ls *.fpk)
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.fnpack_platform }}"
          mv "$FPKN" "deepseek-harness_${VERSION}_${PLATFORM}.fpk"
          echo "✅ 构建完成: $(ls -lh *.fpk)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.fnpack_platform }}
          path: "deepseek-harness/*.fpk"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: 获取版本号
        id: version
        run: |
          MANIFEST_VER=$(grep '^version' deepseek-harness/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$MANIFEST_VER" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.version }}"
          files: ./artifacts/**/*.fpk
          generate_release_notes: false
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.version }}

            ### 📦 下载

            | 文件 | 架构 | 适用设备 |
            |------|------|----------|
            | `deepseek-harness_${{ steps.version.outputs.version }}_x86.fpk` | x86_64 | Intel/AMD NAS |
            | `deepseek-harness_${{ steps.version.outputs.version }}_arm.fpk` | arm64 | ARM NAS |

            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
