name: Build DeepSeek Harness FPK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构'
        required: true
        default: 'arm'
        type: choice
        options:
          - arm
          - x86
          - all

permissions:
  contents: write

jobs:
  build-arm:
    name: Build ARM64
    if: inputs.platform == 'arm' || inputs.platform == 'all'
    runs-on: ubuntu-24.04-arm
    outputs:
      fpk_name: ${{ steps.build.outputs.fpk_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package
        env:
          TARBALL_ARCH: arm64
        run: bash scripts/build.sh

      - name: Get DSH Version
        id: dsh
        run: |
          DSH_VER=$(tar -xzf app_arm64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=${DSH_VER}" >> $GITHUB_OUTPUT
          echo "DSH版本: ${DSH_VER}"

      - name: Build FPK
        id: build
        run: |
          DSH_VER="${{ steps.dsh.outputs.version }}"
          CHECKSUM=$(md5sum app_arm64.tgz | cut -d' ' -f1)
          WORK_DIR=$(mktemp -d)
          PKG="$WORK_DIR/package"

          mkdir -p "$PKG/cmd"
          cp app_arm64.tgz "$PKG/app.tgz"
          cp -a deepseek-harness/cmd/.* "$PKG/cmd/" 2>/dev/null || cp -a deepseek-harness/cmd/. "$PKG/cmd/"
          cp -a deepseek-harness/config "$PKG/config"
          cp -a deepseek-harness/wizard "$PKG/"
          cp deepseek-harness/*.sc "$PKG/" 2>/dev/null || true
          cp deepseek-harness/ICON*.PNG "$PKG/"
          cp -a deepseek-harness/app/ui "$PKG/"
          [ -d "$PKG/ui/images" ] && [ -f "$PKG/ICON_256.PNG" ] && cp "$PKG/ICON_256.PNG" "$PKG/ui/images/256.png"

          find "$PKG" -type d -exec chmod 755 {} +
          find "$PKG" -type f -exec chmod 644 {} +
          chmod -R 755 "$PKG/cmd" "$PKG/wizard"

          cp deepseek-harness/manifest "$PKG/manifest"
          sed -i "s/^version.*=.*/version               = ${DSH_VER}/" "$PKG/manifest"
          sed -i "s/^platform.*=.*/platform              = arm/" "$PKG/manifest"
          sed -i "s/^checksum.*=.*/checksum              = ${CHECKSUM}/" "$PKG/manifest"

          FPK_NAME="deepseek-harness_${DSH_VER}_arm.fpk"
          cd "$PKG" && tar --owner=0 --group=0 --numeric-owner -czf "$GITHUB_WORKSPACE/$FPK_NAME" *
          cd "$GITHUB_WORKSPACE" && rm -rf "$WORK_DIR"
          echo "fpk_name=${FPK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Built: $FPK_NAME"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fpk-arm
          path: "*_arm.fpk"
          if-no-files-found: error

  build-x86:
    name: Build x86_64
    if: inputs.platform == 'x86' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    outputs:
      fpk_name: ${{ steps.build.outputs.fpk_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package
        env:
          TARBALL_ARCH: amd64
        run: bash scripts/build.sh

      - name: Get DSH Version
        id: dsh
        run: |
          DSH_VER=$(tar -xzf app_amd64.tgz -O node_modules/@deepseek-ai/dsh/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          if [ -z "$DSH_VER" ]; then
            DSH_VER=$(npm view @deepseek-ai/dsh@latest version 2>/dev/null)
          fi
          echo "version=${DSH_VER}" >> $GITHUB_OUTPUT
          echo "DSH版本: ${DSH_VER}"

      - name: Build FPK
        id: build
        run: |
          DSH_VER="${{ steps.dsh.outputs.version }}"
          CHECKSUM=$(md5sum app_amd64.tgz | cut -d' ' -f1)
          WORK_DIR=$(mktemp -d)
          PKG="$WORK_DIR/package"

          mkdir -p "$PKG/cmd"
          cp app_amd64.tgz "$PKG/app.tgz"
          cp -a deepseek-harness/cmd/.* "$PKG/cmd/" 2>/dev/null || cp -a deepseek-harness/cmd/. "$PKG/cmd/"
          cp -a deepseek-harness/config "$PKG/config"
          cp -a deepseek-harness/wizard "$PKG/"
          cp deepseek-harness/*.sc "$PKG/" 2>/dev/null || true
          cp deepseek-harness/ICON*.PNG "$PKG/"
          cp -a deepseek-harness/app/ui "$PKG/"
          [ -d "$PKG/ui/images" ] && [ -f "$PKG/ICON_256.PNG" ] && cp "$PKG/ICON_256.PNG" "$PKG/ui/images/256.png"

          find "$PKG" -type d -exec chmod 755 {} +
          find "$PKG" -type f -exec chmod 644 {} +
          chmod -R 755 "$PKG/cmd" "$PKG/wizard"

          cp deepseek-harness/manifest "$PKG/manifest"
          sed -i "s/^version.*=.*/version               = ${DSH_VER}/" "$PKG/manifest"
          sed -i "s/^platform.*=.*/platform              = x86/" "$PKG/manifest"
          sed -i "s/^checksum.*=.*/checksum              = ${CHECKSUM}/" "$PKG/manifest"

          FPK_NAME="deepseek-harness_${DSH_VER}_x86.fpk"
          cd "$PKG" && tar --owner=0 --group=0 --numeric-owner -czf "$GITHUB_WORKSPACE/$FPK_NAME" *
          cd "$GITHUB_WORKSPACE" && rm -rf "$WORK_DIR"
          echo "fpk_name=${FPK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Built: $FPK_NAME"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: "*_x86.fpk"
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-arm, build-x86]
    if: always() && (needs.build-arm.result == 'success' || needs.build-x86.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get Version
        id: version
        run: |
          MANIFEST_VER=$(grep "^version" deepseek-harness/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=${MANIFEST_VER}" >> $GITHUB_OUTPUT
          mkdir -p release
          find artifacts -name "*.fpk" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "DeepSeek Harness v${{ steps.version.outputs.version }}"
          files: release/*.fpk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DeepSeek Harness v${{ steps.version.outputs.version }}
            
            ### 下载安装包
            - **x86_64**: `deepseek-harness_${{ steps.version.outputs.version }}_x86.fpk`
            - **ARM64**: `deepseek-harness_${{ steps.version.outputs.version }}_arm.fpk`
            
            ### 安装方式
            1. 下载对应架构的 `.fpk` 文件
            2. 登录飞牛NAS桌面 → 应用中心 → 手动安装
            3. 选择下载的文件完成安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
