name: Build DeepSeek Harness FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DSH npm版本 (留空则使用manifest中的版本)'
        required: false
        default: ''
      platform:
        description: '目标架构'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - x86
          - arm

permissions:
  contents: write

jobs:
  build:
    name: Build FPK Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build App Package
        env:
          VERSION: ${{ inputs.version }}
          TARBALL_ARCH: amd64
        run: bash scripts/build.sh

      - name: Build FPK (x86)
        if: inputs.platform == 'both' || inputs.platform == 'x86'
        run: bash build-fpk.sh "${{ inputs.version }}" x86

      - name: Build FPK (ARM)
        if: inputs.platform == 'both' || inputs.platform == 'arm'
        run: bash build-fpk.sh "${{ inputs.version }}" arm

      - name: List Artifacts
        run: ls -lh *.fpk 2>/dev/null || echo "无FPK产物"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-fpk
          path: "*.fpk"
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.fpk"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
